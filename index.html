<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dog Company - Residencia Canina</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
:root{
  --wrap: 1200px;
  --header-h: 92px;
  --header-h-m: 120px;

  --brand:#25D366;
  --gold:#F5C223;

  --paws-url: url("./DETGED_Mesa-de-trabajo-1.jpg");

  --paws-opacity: 0.10;
  --paws-size: 920px;
  --paws-shift-x: 0px;
  --paws-shift-y: 0px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  position:relative;
  min-height:100%;
  font-family:'Poppins', sans-serif;
  color:#333;
  line-height:1.6;
  scroll-behavior:smooth;

  background:
    radial-gradient(1200px 600px at 10% 10%, #f3eeff, transparent 60%),
    radial-gradient(1000px 600px at 90% 20%, #f8f5ff, transparent 55%),
    radial-gradient(900px 700px at 50% 95%, #f1ecff, transparent 60%),
    #ffffff;
}

/* Patitas */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image: var(--paws-url);
  background-repeat: repeat;
  background-size: var(--paws-size);
  background-position: var(--paws-shift-x) var(--paws-shift-y);
  opacity: var(--paws-opacity);
  filter: saturate(0.9) contrast(0.95);
}

a{ text-decoration:none; color:inherit; }

/* ===== Footer ===== */
footer{
  background: rgba(20,20,20,0.92);
  color:white;
  text-align:center;
  padding:60px 20px;
  margin-top: 30px;
  border-top: 1px solid rgba(255,255,255,0.08);
}

.footer-inner{
  max-width:1200px;
  margin:0 auto;
}

.footer-grid{
  display:grid;
  grid-template-columns: 1.1fr 1fr 1fr;
  gap:18px;
  align-items:start;
  text-align:left;
  margin-bottom:14px;
}

.footer-title{
  font-weight:900;
  letter-spacing:.3px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:10px;
}
.footer-title i{ color: rgba(245,194,35,0.95); }

.footer-muted{ color: rgba(255,255,255,0.82); font-weight:700; }

.footer-trust{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:flex-start;
  margin-top:14px;
}

.footer-trust-pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border-radius:999px;
  background: rgba(255,255,255,0.10);
  border:1px solid rgba(255,255,255,0.14);
  color: rgba(255,255,255,0.92);
  font-weight:900;
  font-size:0.90em;
}

.footer-trust-pill i{
  color: rgba(245,194,35,0.95);
}

.footer-copy{
  margin-top:22px;
  padding-top:16px;
  border-top:1px solid rgba(255,255,255,0.12);
  font-size:0.95em;
  color: rgba(255,255,255,0.78);
}

@media(max-width:768px){
  .footer-grid{
    grid-template-columns:1fr;
    text-align:center;
  }
  .footer-title,
  .footer-trust{
    justify-content:center;
  }
}
</style>
</head>

<body>

<footer id="contacto">
  <div class="footer-inner">

    <div class="footer-grid">

      <div>
        <div class="footer-title">
          <i class="fa-solid fa-location-dot"></i> Ubicación
        </div>
        <div class="footer-muted">Alicante Centro</div>
      </div>

      <div>
        <div class="footer-title">
          <i class="fa-regular fa-clock"></i> Horario
        </div>
        <div class="footer-muted">10:00h a 20:00h · Lunes a Domingo</div>

        <!-- ✅ BLOQUE DE CONFIANZA LIMPIO -->
        <div class="footer-trust" aria-label="Bloque de confianza">

          <span class="footer-trust-pill">
            <i class="fa-solid fa-star"></i> 5.0 Reseñas
          </span>

          <a class="footer-trust-pill"
             href="https://www.rover.com/sit/aialas113946"
             target="_blank"
             rel="noopener"
             aria-label="Ver perfil en Rover">
             <i class="fa-solid fa-medal"></i> 150+ reseñas en Rover
          </a>

        </div>
      </div>

      <div>
        <div class="footer-title">
          <i class="fa-solid fa-heart"></i> Contacto
        </div>

        <div class="footer-muted" style="line-height:1.55;">
          No dudes en ponerte en contacto con nosotras. En Dog Company estaremos encantadas de atenderte cuando necesites.
        </div>
      </div>

    </div>

    <div class="footer-copy">
      © <span id="year"></span> Dog Company. Todos los derechos reservados.
    </div>

  </div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
