<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dog Company - Residencia Canina</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
:root{
  --wrap: 1200px;
  --header-h: 92px;
  --header-h-m: 120px;

  --brand:#25D366;
  --gold:#F5C223;

  --paws-url: url("./DETGED_Mesa-de-trabajo-1.jpg");
  --paws-opacity: 0.10;
  --paws-size: 920px;
  --paws-shift-x: 0px;
  --paws-shift-y: 0px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  position:relative;
  min-height:100%;
  font-family:'Poppins', sans-serif;
  color:#333;
  line-height:1.6;
  scroll-behavior:smooth;
  background:
    radial-gradient(1200px 600px at 10% 10%, #f3eeff, transparent 60%),
    radial-gradient(1000px 600px at 90% 20%, #f8f5ff, transparent 55%),
    radial-gradient(900px 700px at 50% 95%, #f1ecff, transparent 60%),
    #ffffff;
}

/* Patitas */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image: var(--paws-url);
  background-repeat: repeat;
  background-size: var(--paws-size);
  background-position: var(--paws-shift-x) var(--paws-shift-y);
  opacity: var(--paws-opacity);
  filter: saturate(0.9) contrast(0.95);
}

a{ text-decoration:none; color:inherit; }

/* ===== Header ===== */
header{
  position:fixed; top:0; width:100%; z-index:999;
  background: rgba(255,255,255,0.86);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(0,0,0,0.06);
}
.header-inner{
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 14px 18px;
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  align-items:center;
  column-gap: 18px;
}

/* ===== Hero / Carrusel ===== */
.hero-slider{
  position:relative;
  width:100%;
  height:72vh;
  min-height:520px;
  overflow:hidden;
  margin-top: var(--header-h);
  background:#000;
}

.slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition: opacity 1s;
}
.slide.active{ opacity:1; }

.slide::before{
  content:"";
  position:absolute;
  inset:-30px;
  background-image: var(--bg);
  background-size: cover;
  background-position: center;
  filter: blur(18px);
  transform: scale(1.08);
}
.slide::after{
  content:"";
  position:absolute;
  inset:0;
  background-image: var(--bg);
  background-size: contain;
  background-position: center;
  background-repeat:no-repeat;
}

/* ✅ AJUSTE APLICADO AQUÍ */
@media(max-width:768px){
  .slide.first-photo::after{
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
  }
}

.slide.video::before,
.slide.video::after{ content:none; }

/* ===================================================== */
/*  👉 TODO LO DEMÁS ES EXACTAMENTE IGUAL A TU ARCHIVO 👈 */
/* ===================================================== */

</style>
</head>

<body>

<div class="hero-slider" id="top">
  <div class="slide first-photo active" style="--bg:url('fbdfbsdfbds.jpg');"></div>

  <div class="slide video">
    <video class="hero-video-bg" autoplay muted playsinline loop preload="auto">
      <source src="./document6014938721218992869.mp4" type="video/mp4">
    </video>
    <video class="hero-video-main" autoplay muted playsinline loop preload="auto">
      <source src="./document6014938721218992869.mp4" type="video/mp4">
    </video>
  </div>

  <div class="slide" style="--bg:url('https://raw.githubusercontent.com/DogCompany7/Dog-Company/15b5e6d0237709b3b90e694c0a7ade6bb6a71a46/b4c1ee43-8999-4a6c-ac2f-dbf4386ec211.jpg');"></div>
</div>

</body>
</html>
