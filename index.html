<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dog Company - Residencia Canina</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
:root{
  --wrap:1200px;
  --header-h:90px;
  --header-h-m:150px;
  --brand:#25D366;
  --gold:#F5C223;
}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  color:#333;
  background:#f6f3ff;
}

a{text-decoration:none;color:inherit}

/* ================= HEADER ================= */
header{
  position:fixed;
  top:0;
  width:100%;
  z-index:999;
  background:rgba(255,255,255,.95);
}

.header-inner{
  max-width:var(--wrap);
  margin:auto;
  padding:15px 20px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}

nav{
  display:flex;
  gap:22px;
  font-weight:700;
}

nav a:hover{color:var(--brand)}

.logo-container{
  position:relative;
  justify-self:center;
}

.logo-container::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--gold);
  border-bottom-right-radius:25px;
  z-index:-1;
}

.logo{
  font-family:'Playfair Display',serif;
  font-size:2em;
  padding:20px;
}

.reserve-btn{
  justify-self:end;
  background:var(--brand);
  color:#fff;
  padding:10px 18px;
  border-radius:999px;
  font-weight:800;
}

/* ================= HERO / CARRUSEL ================= */
.hero-slider{
  position:relative;
  width:100%;
  height:55vh;
  min-height:500px;
  margin-top:var(--header-h);
  overflow:hidden;
  background:#000;
}

.slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity 1s;
}
.slide.active{opacity:1}

/* 🎯 AJUSTE ÚNICO DEL VÍDEO */
.hero-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center;
}

@media(max-width:768px){
  .hero-video{
    object-fit:contain;
    background:#000;
  }
}

/* Overlay */
.hero-overlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.3);
  z-index:1;
}

/* Texto */
.hero-content{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding-left:40px;
  z-index:2;
}

.hero-card{
  background:rgba(0,0,0,.25);
  backdrop-filter:blur(6px);
  border-radius:16px;
  padding:20px;
  max-width:340px;
  color:#fff;
}

.hero-card h1{
  font-family:'Playfair Display',serif;
  font-size:1.6em;
  margin-bottom:8px;
}

.hero-card p{
  font-size:1em;
  margin-bottom:12px;
}

.hero-card a{
  background:var(--brand);
  padding:10px 18px;
  border-radius:999px;
  font-weight:800;
  display:inline-block;
}

/* ================= SECCIONES ================= */
section{
  max-width:var(--wrap);
  margin:60px auto;
  padding:60px 20px;
  background:#fff;
  border-radius:26px;
}

/* ================= FOOTER ================= */
footer{
  background:#111;
  color:#fff;
  text-align:center;
  padding:50px 20px;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <nav>
      <a href="#top">Inicio</a>
      <a href="#servicios">Servicios</a>
    </nav>

    <div class="logo-container">
      <div class="logo">Dog Company</div>
    </div>

    <a class="reserve-btn" href="#reservaForm">Reservar</a>
  </div>
</header>

<!-- HERO -->
<div class="hero-slider" id="top">
  <div class="slide active">
    <video class="hero-video" autoplay muted loop playsinline>
      <source src="./document6014938721218992869.mp4" type="video/mp4">
    </video>
  </div>

  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="hero-card">
      <h1>Dog Company</h1>
      <p>Cuidado personalizado, entorno tranquilo y atención como en casa</p>
      <a href="#reservaForm">Reservar</a>
    </div>
  </div>
</div>

<section id="servicios">
  <h2 style="text-align:center;font-family:'Playfair Display',serif;">Nuestros servicios</h2>
</section>

<section>
  <form id="reservaForm">
    <!-- tu formulario sigue aquí intacto -->
  </form>
</section>

<footer>
  <p>Dog Company · Alicante</p>
</footer>

</body>
</html>
