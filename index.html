<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dog Company - Residencia Canina</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
:root{
  --wrap: 1200px;
  --header-h: 92px;
  --header-h-m: 120px;

  --brand:#25D366;
  --gold:#F5C223;

  /* ✅ TU ARCHIVO (misma carpeta que index.html) */
  --paws-url: url("./DETGED_Mesa-de-trabajo-1.jpg");

  /* Fondo */
  --paws-opacity: 0.10;
  --paws-size: 920px;
  --paws-shift-x: 0px;
  --paws-shift-y: 0px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  position:relative;
  min-height:100%;
  font-family:'Poppins', sans-serif;
  color:#333;
  line-height:1.6;
  scroll-behavior:smooth;

  background:
    radial-gradient(1200px 600px at 10% 10%, #f3eeff, transparent 60%),
    radial-gradient(1000px 600px at 90% 20%, #f8f5ff, transparent 55%),
    radial-gradient(900px 700px at 50% 95%, #f1ecff, transparent 60%),
    #ffffff;
}

/* ✅ Patitas reales */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;

  background-image: var(--paws-url);
  background-repeat: repeat;
  background-size: var(--paws-size);
  background-position: var(--paws-shift-x) var(--paws-shift-y);

  opacity: var(--paws-opacity);
  filter: saturate(0.9) contrast(0.95);
}

/* Evita que el header tape las secciones */
#top, #servicios, #reservaForm, #resenas-footer, #quienes-somos-footer, #contacto{
  scroll-margin-top: calc(var(--header-h) + 16px);
}
@media(max-width:768px){
  #top, #servicios, #reservaForm, #resenas-footer, #quienes-somos-footer, #contacto{
    scroll-margin-top: calc(var(--header-h-m) + 16px);
  }
}

a{ text-decoration:none; color:inherit; }

/* ===== Header ===== */
header{
  position:fixed; top:0; width:100%; z-index:999;
  background: rgba(255,255,255,0.86);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(0,0,0,0.06);
}
.header-inner{
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 14px 18px;
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  align-items:center;
  column-gap: 18px;
}
header nav{
  display:flex;
  gap: 18px;
  font-weight:700;
  justify-self:start;
  white-space:nowrap;
  font-size:0.96em;
  color:#333;
}
header nav a{
  color:#333;
  padding: 6px 3px;
  transition: color .25s ease, transform .2s ease;
}
header nav a:hover{ color: var(--brand); transform: translateY(-1px); }

.logo-container{
  justify-self:center;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo-container::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:390px;
  height:92px;
  background-color: var(--gold);
  z-index:-1;
  border-bottom-right-radius:26px;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,.10));
}
.logo{
  font-family:'Playfair Display', serif;
  font-size:1.95em;
  font-weight:bold;
  color:black;
  padding:22px 18px;
  white-space:nowrap;
}

.reserve-btn{
  justify-self:end;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 16px;
  border-radius:999px;
  font-weight:800;
  background: var(--brand);
  color:white;
  white-space:nowrap;
  box-shadow: 0 10px 24px rgba(37,211,102,.25);
  transition: transform .15s ease, box-shadow .2s ease;
}
.reserve-btn:hover{ transform: translateY(-1px); box-shadow: 0 14px 30px rgba(37,211,102,.28); }

.menu-btn{
  display:none;
  justify-self:end;
  border:1px solid rgba(0,0,0,0.10);
  background: rgba(255,255,255,0.85);
  border-radius:12px;
  padding:10px 12px;
  cursor:pointer;
  align-items:center;
  gap:10px;
  font-weight:800;
}
.menu-btn i{ font-size:1.05em; }

.mobile-nav{
  display:none;
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 18px 14px 18px;
}
.mobile-nav a{
  display:block;
  padding:12px 10px;
  border-radius:12px;
  font-weight:800;
  background: rgba(255,255,255,0.75);
  border: 1px solid rgba(0,0,0,0.06);
  margin-top:10px;
}
.mobile-nav a:hover{ background: rgba(255,255,255,0.92); }

/* ===== Hero / Carrusel ===== */
.hero-slider{
  position:relative;
  width:100%;
  height:72vh;
  min-height: 520px;
  overflow:hidden;
  margin-top: var(--header-h);
  background:#000;
}

/* Slides fotos */
.slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition: opacity 1s;
}
.slide.active{ opacity:1; }
.slide::before{
  content:"";
  position:absolute;
  inset:-30px;
  background-image: var(--bg);
  background-size: cover;
  background-position: center;
  filter: blur(18px);
  transform: scale(1.08);
}
.slide::after{
  content:"";
  position:absolute;
  inset:0;
  background-image: var(--bg);
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
}

/* Vídeo */
.slide.video::before,
.slide.video::after{ content:none; }

.hero-video-bg{
  position:absolute;
  inset:-30px;
  width: calc(100% + 60px);
  height: calc(100% + 60px);
  object-fit: cover;
  object-position:center;
  filter: blur(18px) brightness(.70);
  transform: scale(1.06);
}
.hero-video-main{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit: contain;
  object-position:center;
}

/* Overlay */
.hero-overlay{
  position:absolute;
  inset:0;
  background:
    radial-gradient(900px 520px at 50% 45%, rgba(0,0,0,0.00), rgba(0,0,0,0.42) 72%),
    linear-gradient(to top, rgba(0,0,0,0.42), rgba(0,0,0,0.08));
  z-index:2;
}

.hero-content{
  position:absolute;
  inset:0;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding: 24px 18px;
  max-width: var(--wrap);
  margin: 0 auto;
}

/* Hero card */
.hero-card{
  width: min(360px, 86vw);
  max-height: 58vh;
  overflow:auto;
  background: rgba(0,0,0,0.18);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 16px;
  box-shadow: 0 18px 45px rgba(0,0,0,.20);
  padding: 12px 12px 10px 12px;
  text-align:left;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* ========================= */
/* 🔴 AQUÍ ESTÁ EL ÚNICO CAMBIO */
/* ========================= */

<div class="slide active" style="--bg:url('fbdfbsdfbds.jpg');"></div>

<div class="slide video">
  <video class="hero-video-bg" autoplay muted playsinline loop preload="auto">
    <source src="./document6014938721218992869.mp4" type="video/mp4">
  </video>
  <video class="hero-video-main" autoplay muted playsinline loop preload="auto">
    <source src="./document6014938721218992869.mp4" type="video/mp4">
  </video>
</div>

<div class="slide" style="--bg:url('https://raw.githubusercontent.com/DogCompany7/Dog-Company/15b5e6d0237709b3b90e694c0a7ade6bb6a71a46/b4c1ee43-8999-4a6c-ac2f-dbf4386ec211.jpg');"></div>
<div class="slide" style="--bg:url('https://raw.githubusercontent.com/DogCompany7/Dog-Company/162e09159041e7aa0d2f8fe0fb38146b550eaea7/06a11129-d358-454c-a15e-bc0f786909b6.jpg');"></div>
<div class="slide" style="--bg:url('https://raw.githubusercontent.com/DogCompany7/Dog-Company/162e09159041e7aa0d2f8fe0fb38146b550eaea7/fff61fbc-7603-43fe-8133-9e453dd67e64.jpg');"></div>

<!-- ========================= -->

</style>
</head>
