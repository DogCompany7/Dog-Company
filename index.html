<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dog Company - Residencia Canina</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
:root{
  --wrap: 1200px;
  --header-h: 90px;
  --header-h-m: 150px;
}

body { margin:0; font-family:'Poppins', sans-serif; color:#333; line-height:1.6; scroll-behavior:smooth; }
a { text-decoration:none; color:inherit; }

/* Evita que el header tape las secciones */
#top, #servicios, #reservaForm, #resenas-footer, #quienes-somos-footer, #contacto {
  scroll-margin-top: calc(var(--header-h) + 15px);
}
@media(max-width:768px){
  #top, #servicios, #reservaForm, #resenas-footer, #quienes-somos-footer, #contacto {
    scroll-margin-top: calc(var(--header-h-m) + 15px);
  }
}

/* Header fijo */
header {
  position: fixed;
  top:0;
  width:100%;
  z-index:999;
  background: rgba(255,255,255,0.95);
}

/* Header */
.header-inner{
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 15px 0;
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  align-items:center;
  column-gap: 18px;
}

/* Nav izquierda */
header nav{
  display:flex;
  gap: 22px;
  font-weight:700;
  justify-self:start;
  white-space:nowrap;
  font-size:0.98em;
  color:#333;
}

header nav a{
  color:#333;
  padding: 6px 3px;
  transition: color 0.3s ease, transform 0.2s ease;
}

header nav a:hover{
  color:#25D366;
  transform: scale(1.08);
}

/* Logo centrado */
.logo-container{
  justify-self:center;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo-container::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:420px;
  height:100px;
  background-color:#F5C223;
  z-index:-1;
  border-bottom-right-radius:25px;
}
.logo{
  font-family:'Playfair Display', serif;
  font-size:2em;
  font-weight:bold;
  color:black;
  padding:25px 20px;
  white-space:nowrap;
}

/* Botón Reservar derecha */
.reserve-btn{
  justify-self:end;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 18px;
  border-radius:999px;
  font-weight:700;
  background:#25D366;
  color:white;
  white-space:nowrap;
}

/* 🎯 Hero / Carrusel ajustado */
.hero-slider{
  position:relative;
  height:52vh;                    /* ⬅️ antes 60vh */
  overflow:hidden;
  max-width: var(--wrap);
  margin: var(--header-h) auto 0;
}

.slide{
  position:absolute;
  width:100%;
  height:100%;
  background-size: cover;
  background-position: center 40%;   /* ⬅️ subimos un poco el encuadre */
  opacity:0;
  transition:opacity 1s;
}
.slide.active{ opacity:1; }

.hero-overlay{
  position:absolute;
  inset:0;
  background: rgba(0,0,0,0.3);
}

.hero-text{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  color:white;
  z-index:2;
  max-width:70%;
}
.hero-text h1{
  font-family:'Playfair Display', serif;
  font-size:2.2em;
  margin-bottom:10px;
  text-shadow:2px 2px 8px rgba(0,0,0,0.6);
}
.hero-text p{
  font-size:1.1em;
  margin-bottom:20px;
  text-shadow:1px 1px 5px rgba(0,0,0,0.6);
}
.hero-text .btn{
  background:#25D366;
  color:white;
  padding:12px 28px;
  border-radius:30px;
  font-weight:bold;
}

/* Presentación */
.presentacion{
  font-family:'Merriweather', serif;
  font-size:1.3em;
  color:#444;
  text-align:center;
  margin:50px 0;
  line-height:1.7;
}

/* Secciones */
section{ padding:80px 20px; max-width: var(--wrap); margin:auto; position:relative; }

/* Responsive móvil */
@media(max-width:768px){
  .hero-slider{
    height:42vh;                 /* ⬅️ más bajo en móvil */
    max-width:100%;
    margin-top: var(--header-h-m);
  }

  .slide{
    background-position: center 35%;   /* ⬅️ ajuste móvil */
  }

  .header-inner{
    max-width:100%;
    padding:12px 16px;
    grid-template-columns: 1fr;
    row-gap: 10px;
    justify-items:center;
  }

  header nav{
    gap:14px;
    font-size:0.9em;
    flex-wrap:wrap;
    justify-content:center;
    text-align:center;
    white-space:normal;
  }

  .logo-container::before{ width:260px; height:80px; }
  .logo{ font-size:1.6em; padding:18px 14px; }

  .reserve-btn{
    width:100%;
    max-width:320px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <nav>
      <a href="#top">Inicio</a>
      <a href="#servicios">Servicios</a>
      <a href="#resenas-footer">Reseñas</a>
      <a href="#quienes-somos-footer">Quiénes somos</a>
    </nav>

    <div class="logo-container">
      <div class="logo">Dog Company</div>
    </div>

    <a class="reserve-btn" href="#reservaForm">Reservar</a>
  </div>
</header>

<!-- 🔁 CARRUSEL -->
<div class="hero-slider" id="top">
  <div class="slide active" style="background-image:url('https://raw.githubusercontent.com/DogCompany7/Dog-Company/15b5e6d0237709b3b90e694c0a7ade6bb6a71a46/b4c1ee43-8999-4a6c-ac2f-dbf4386ec211.jpg');"></div>
  <div class="slide" style="background-image:url('https://raw.githubusercontent.com/DogCompany7/Dog-Company/162e09159041e7aa0d2f8fe0fb38146b550eaea7/06a11129-d358-454c-a15e-bc0f786909b6.jpg');"></div>
  <div class="slide" style="background-image:url('https://raw.githubusercontent.com/DogCompany7/Dog-Company/162e09159041e7aa0d2f8fe0fb38146b550eaea7/fff61fbc-7603-43fe-8133-9e453dd67e64.jpg');"></div>

  <div class="hero-overlay"></div>

  <div class="hero-text">
    <h1>Dog Company</h1>
    <p>Cuidado personalizado, entorno tranquilo y atención como en casa</p>
    <a class="btn" href="https://wa.me/34TUNUMERO" target="_blank">Reservar por WhatsApp</a>
  </div>
</div>

<!-- resto del contenido permanece igual -->

</body>
</html>
