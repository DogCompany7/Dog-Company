<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Dog Company - Residencia Canina</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
:root{
  --wrap:1200px;
  --brand:#25D366;
  --gold:#F5C223;
}

/* ===== BASE ===== */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;
  color:#333;
  background:#f6f4ff;
}
a{text-decoration:none;color:inherit}

/* ===== HEADER ===== */
header{
  position:fixed;top:0;width:100%;z-index:999;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);
}
.header-inner{
  max-width:var(--wrap);
  margin:auto;
  padding:14px 18px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}
header nav{
  display:flex;
  gap:18px;
  font-weight:700;
}
header nav a:hover{color:var(--brand)}
.logo-container{
  position:relative;
  justify-self:center;
}
.logo-container::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--gold);
  border-bottom-right-radius:22px;
  z-index:-1;
}
.logo{
  font-family:'Playfair Display',serif;
  font-size:1.8em;
  padding:18px 22px;
}
.reserve-btn{
  justify-self:end;
  background:var(--brand);
  color:#fff;
  padding:10px 18px;
  border-radius:999px;
  font-weight:700;
}

/* ===== HERO ===== */
.hero-slider{
  margin-top:92px;
  height:70vh;
  min-height:500px;
  position:relative;
  overflow:hidden;
}
.slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity 1s;
}
.slide.active{opacity:1}
.slide::before{
  content:"";
  position:absolute;
  inset:-30px;
  background-image:var(--bg);
  background-size:cover;
  background-position:center;
  filter:blur(18px);
  transform:scale(1.08);
}
.slide::after{
  content:"";
  position:absolute;
  inset:0;
  background-image:var(--bg);
  background-size:contain;
  background-position:center;
  background-repeat:no-repeat;
}
.hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.45),rgba(0,0,0,.1));
}

/* ===== HERO CONTENT ===== */
.hero-content{
  position:absolute;
  inset:0;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  max-width:var(--wrap);
  margin:auto;
  padding:20px;
}

/* GLASS CARD */
.hero-card{
  width:min(380px,86vw);
  max-height:58vh;
  background:rgba(0,0,0,.18);
  border:1px solid rgba(255,255,255,.14);
  border-radius:16px;
  padding:12px;
  backdrop-filter:blur(10px);
  color:#fff;
}
.hero-badge{
  display:inline-block;
  background:var(--gold);
  color:#111;
  padding:6px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:.8em;
  margin-bottom:6px;
}
.hero-card h1{
  font-family:'Playfair Display',serif;
  font-size:1.5em;
}
.hero-card p{
  font-size:.95em;
  margin:6px 0 10px;
}
.trust-row{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:10px;
}
.trust-pill{
  background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.25);
  padding:5px 10px;
  border-radius:999px;
  font-size:.85em;
}
.hero-actions{
  display:flex;
  gap:10px;
}
.hero-actions .btn{
  padding:8px 14px;
  border-radius:999px;
  font-weight:700;
  font-size:.9em;
}
.btn-primary{
  background:var(--brand);
  color:#fff;
}
.btn-secondary{
  background:rgba(255,255,255,.15);
  color:#fff;
  border:1px solid rgba(255,255,255,.3);
}

/* ===== SECTIONS ===== */
section{
  max-width:var(--wrap);
  margin:60px auto;
  padding:60px 20px;
  background:#fff;
  border-radius:26px;
}
.presentacion{
  font-size:1.25em;
  text-align:center;
  max-width:70ch;
  margin:20px auto;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){

  header nav{display:none}
  .reserve-btn{grid-column:1/-1;margin-top:8px}

  .hero-slider{
    height:60vh;
    min-height:460px;
  }

  .hero-content{
    align-items:flex-end;
    justify-content:center;
    padding:0 14px 12px;
  }

  .hero-card{
    width:min(320px,88vw);
    max-height:34vh;
    background:rgba(0,0,0,.14);
    backdrop-filter:blur(8px);
    padding:10px;
  }

  .hero-card h1{font-size:1.25em}
  .hero-card p{font-size:.88em}

  .trust-row{display:none}

  .hero-actions .btn{
    font-size:.85em;
    padding:8px 12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <nav>
      <a href="#top">Inicio</a>
      <a href="#servicios">Servicios</a>
      <a href="#contacto">Contacto</a>
    </nav>

    <div class="logo-container">
      <div class="logo">Dog Company</div>
    </div>

    <a class="reserve-btn" href="#reserva">Reservar</a>
  </div>
</header>

<div class="hero-slider" id="top">
  <div class="slide active" style="--bg:url('https://raw.githubusercontent.com/DogCompany7/Dog-Company/main/b4c1ee43-8999-4a6c-ac2f-dbf4386ec211.jpg')"></div>
  <div class="slide" style="--bg:url('https://raw.githubusercontent.com/DogCompany7/Dog-Company/main/06a11129-d358-454c-a15e-bc0f786909b6.jpg')"></div>
  <div class="slide" style="--bg:url('https://raw.githubusercontent.com/DogCompany7/Dog-Company/main/fff61fbc-7603-43fe-8133-9e453dd67e64.jpg')"></div>

  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="hero-card">
      <div class="hero-badge">Residencia canina</div>
      <h1>Dog Company</h1>
      <p>Cuidado personalizado, entorno tranquilo y atención como en casa</p>

      <div class="trust-row">
        <span class="trust-pill">Trato familiar</span>
        <span class="trust-pill">Entorno seguro</span>
        <span class="trust-pill">Atención individual</span>
      </div>

      <div class="hero-actions">
        <a class="btn btn-primary" href="https://wa.me/34TUNUMERO" target="_blank">WhatsApp</a>
        <a class="btn btn-secondary" href="#servicios">Servicios</a>
      </div>
    </div>
  </div>
</div>

<script>
let slides=document.querySelectorAll('.slide');
let current=0;
setInterval(()=>{
  slides[current].classList.remove('active');
  current=(current+1)%slides.length;
  slides[current].classList.add('active');
},5000);
</script>

</body>
</html>
