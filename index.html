<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dog Company - Residencia Canina</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
:root{
  --wrap: 1200px;
  --header-h: 92px;
  --header-h-m: 120px;
  --brand:#25D366;
  --gold:#F5C223;
  --paws-url: url("./DETGED_Mesa-de-trabajo-1.jpg");
  --paws-opacity: 0.10;
  --paws-size: 920px;
  --paws-shift-x: 0px;
  --paws-shift-y: 0px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  position:relative;
  min-height:100%;
  font-family:'Poppins', sans-serif;
  color:#333;
  line-height:1.6;
  scroll-behavior:smooth;
  background:
    radial-gradient(1200px 600px at 10% 10%, #f3eeff, transparent 60%),
    radial-gradient(1000px 600px at 90% 20%, #f8f5ff, transparent 55%),
    radial-gradient(900px 700px at 50% 95%, #f1ecff, transparent 60%),
    #ffffff;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background-image: var(--paws-url);
  background-repeat: repeat;
  background-size: var(--paws-size);
  background-position: var(--paws-shift-x) var(--paws-shift-y);
  opacity: var(--paws-opacity);
  filter: saturate(0.9) contrast(0.95);
}

a{ text-decoration:none; color:inherit; }

/* ===== Ajuste Perrito MÁS arriba y MÁS grande ===== */
.rover-dog{
  position:absolute;
  top:-220px;
  left:-26px;
  width:120px;
  height:auto;
  pointer-events:none;
  z-index:2;
  filter: drop-shadow(0 10px 18px rgba(0,0,0,0.12));
}
@media(max-width:768px){
  .rover-dog{
    top:-205px;
    left:-18px;
    width:105px;
  }
}

/* ===== RESTO CSS ORIGINAL (SIN CAMBIOS FUNCIONALES) ===== */
/* ... (el resto de tu CSS permanece intacto en producción) ... */
</style>
</head>

</html>
