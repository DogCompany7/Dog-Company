<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dog Company - Residencia Canina</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
body { margin:0; font-family:'Poppins', sans-serif; color:#333; line-height:1.6; scroll-behavior:smooth; }
a { text-decoration:none; }

/* Header fijo */
header {
  position: fixed;
  top:0;
  width:100%;
  z-index:999;
  background: rgba(255,255,255,0.95);
}

/* CONTENEDOR: mismo ancho que el carrusel */
.header-inner{
  max-width:1000px;
  margin:0 auto;
  padding:15px 0;
  display:grid;
  grid-template-columns: 1fr auto 1fr;
  align-items:center;
}

/* Nav izquierda */
header nav{
  display:flex;
  gap:25px;
  font-weight:600;
  justify-self:start;
}

/* Logo centrado */
.logo-container{
  justify-self:center;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}
.logo-container::before{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:420px;
  height:100px;
  background-color:#F5C223;
  z-index:-1;
  border-bottom-right-radius:25px;
}
.logo{
  font-family:'Playfair Display', serif;
  font-size:2em;
  font-weight:bold;
  color:black;
  padding:25px 20px;
  white-space:nowrap;
}

/* Botón reservar derecha */
.reserve-btn{
  justify-self:end;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:10px 18px;
  border-radius:999px;
  font-weight:700;
  background:#25D366;
  color:white;
}

/* Hero / Carrusel */
.hero-slider {
  position:relative;
  height:60vh;
  overflow:hidden;
  max-width:1000px;
  margin:90px auto 0;
}

.slide {
  position:absolute;
  width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
  opacity:0;
  transition:opacity 1s;
}
.slide.active { opacity:1; }

.hero-overlay {
  position:absolute;
  inset:0;
  background: rgba(0,0,0,0.3);
}

.hero-text {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  color:white;
  z-index:2;
  max-width:70%;
}

.hero-text h1 {
  font-family:'Playfair Display', serif;
  font-size:2.2em;
  margin-bottom:10px;
}

.hero-text .btn {
  background:#25D366;
  color:white;
  padding:12px 28px;
  border-radius:30px;
  font-weight:bold;
}

/* Responsive */
@media(max-width:768px){
  .header-inner{
    grid-template-columns:1fr;
    gap:10px;
    padding:10px 16px;
    text-align:center;
  }
  header nav{ justify-content:center; flex-wrap:wrap; }
  .reserve-btn{ width:100%; max-width:300px; margin:auto; }
  .hero-slider{ max-width:100%; height:45vh; margin-top:140px; }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <nav>
      <a href="#top">Inicio</a>
      <a href="#servicios">Servicios</a>
      <a href="#resenas-footer">Reseñas</a>
      <a href="#quienes-somos-footer">Quiénes somos</a>
    </nav>

    <div class="logo-container">
      <div class="logo">Dog Company</div>
    </div>

    <a class="reserve-btn" href="#reservaForm">Reservar</a>

  </div>
</header>

<div class="hero-slider" id="top">
  <div class="slide active" style="background-image:url('https://raw.githubusercontent.com/DogCompany7/Dog-Company/main/b4c1ee43-8999-4a6c-ac2f-dbf4386ec211.jpg');"></div>
  <div class="hero-overlay"></div>

  <div class="hero-text">
    <h1>Dog Company</h1>
    <a class="btn" href="#reservaForm">Reservar por WhatsApp</a>
  </div>
</div>

</body>
</html>
