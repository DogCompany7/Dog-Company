<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dog Company - Residencia Canina</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

<style>
:root{
  --wrap:1200px;
  --header-h:92px;
  --header-h-m:120px;
  --brand:#25D366;
  --gold:#F5C223;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Poppins',sans-serif;
  background:#f6f3ff;
  color:#333;
}

a{text-decoration:none;color:inherit}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  z-index:999;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);
}

.header-inner{
  max-width:var(--wrap);
  margin:auto;
  padding:14px 18px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
}

nav{
  display:flex;
  gap:18px;
  font-weight:700;
}

nav a:hover{color:var(--brand)}

.logo-container{
  position:relative;
  justify-self:center;
}

.logo-container::before{
  content:"";
  position:absolute;
  inset:0;
  background:var(--gold);
  z-index:-1;
  border-bottom-right-radius:26px;
}

.logo{
  font-family:'Playfair Display',serif;
  font-size:1.9em;
  padding:18px 20px;
}

.reserve-btn{
  justify-self:end;
  background:var(--brand);
  color:#fff;
  padding:10px 18px;
  border-radius:999px;
  font-weight:800;
}

/* HERO / CARRUSEL */
.hero-slider{
  position:relative;
  height:72vh;
  min-height:520px;
  margin-top:var(--header-h);
  overflow:hidden;
  background:#000;
}

.slide{
  position:absolute;
  inset:0;
  opacity:0;
  transition:opacity 1s;
}

.slide.active{opacity:1}

/* 🔧 VÍDEO CORREGIDO */
.hero-video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;          /* desktop */
  object-position:center;
}

/* MÓVIL: se ve completo */
@media (max-width:768px){
  .hero-video{
    object-fit:contain;
    background:#000;
  }
}

/* OVERLAY */
.hero-overlay{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.45),rgba(0,0,0,.1));
  z-index:2;
}

/* CONTENIDO HERO */
.hero-content{
  position:absolute;
  inset:0;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:18px;
  z-index:3;
}

.hero-card{
  width:min(320px,88vw);
  background:rgba(0,0,0,.14);
  backdrop-filter:blur(8px);
  border-radius:16px;
  padding:12px;
  color:#fff;
}

.hero-badge{
  background:var(--gold);
  color:#111;
  font-weight:900;
  padding:6px 10px;
  border-radius:999px;
  display:inline-block;
  font-size:.75em;
  margin-bottom:6px;
}

.hero-card h1{
  font-family:'Playfair Display',serif;
  font-size:1.3em;
}

.hero-card p{font-size:.9em}

.hero-actions{
  margin-top:8px;
  display:flex;
  gap:8px;
}

.hero-actions a{
  background:var(--brand);
  padding:8px 12px;
  border-radius:999px;
  font-weight:800;
  font-size:.85em;
  color:#fff;
}

/* SECCIONES */
section{
  max-width:var(--wrap);
  margin:60px auto;
  padding:60px 20px;
  background:#fff;
  border-radius:26px;
}

/* FOOTER */
footer{
  background:#111;
  color:#fff;
  text-align:center;
  padding:50px 20px;
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <nav>
      <a href="#top">Inicio</a>
      <a href="#servicios">Servicios</a>
    </nav>

    <div class="logo-container">
      <div class="logo">Dog Company</div>
    </div>

    <a class="reserve-btn" href="#reservaForm">Reservar</a>
  </div>
</header>

<!-- HERO -->
<div class="hero-slider" id="top">

  <div class="slide active">
    <video class="hero-video" autoplay muted loop playsinline>
      <source src="./document6014938721218992869.mp4" type="video/mp4">
    </video>
  </div>

  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="hero-card">
      <div class="hero-badge">Residencia canina</div>
      <h1>Dog Company</h1>
      <p>Cuidado personalizado, entorno tranquilo y atención como en casa</p>
      <div class="hero-actions">
        <a href="#reservaForm">Reservar</a>
      </div>
    </div>
  </div>
</div>

<section id="servicios">
  <h2 style="text-align:center;font-family:'Playfair Display',serif;">Nuestros servicios</h2>
</section>

<section>
  <form id="reservaForm" class="reserva-form">
    <input type="text" placeholder="Tu nombre" required>
    <textarea placeholder="Cuéntanos sobre tu perro"></textarea>
    <button type="submit">Enviar por WhatsApp</button>
  </form>
</section>

<footer>
  <p>Dog Company · Alicante</p>
</footer>

</body>
</html>
